# Non-www to www Redirect (HTTP)
server {
    listen 80;
    server_name cantateo.fr;
    return 301 https://www.cantateo.fr$request_uri;
}

# Non-www to www Redirect (HTTPS)
server {
    listen 443 ssl http2;
    server_name cantateo.fr;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/cantateo.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cantateo.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.cantateo.fr$request_uri;
}

# Main Site (HTTP to HTTPS)
server {
    listen 80;
    server_name www.cantateo.fr;
    return 301 https://www.cantateo.fr$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.cantateo.fr;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/cantateo.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cantateo.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Django owns CSP because it injects a per-request nonce for JSON-LD.

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Static files
    location /static/ {
        alias /var/www/cantateo/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Favicon
    location /favicon.ico {
        alias /var/www/cantateo/staticfiles/favicon.ico;
        expires 30d;
        access_log off;
    }

    # Robots.txt
    location /robots.txt {
        alias /var/www/cantateo/staticfiles/robots.txt;
        expires 7d;
        access_log off;
    }

    # Django application
    location / {
        client_max_body_size 50M;
        proxy_pass http://unix:/var/www/cantateo/cantateo.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Logs
    access_log /var/log/nginx/cantateo_access.log;
    error_log /var/log/nginx/cantateo_error.log;
}
