name: CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cantateo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cantateo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: psalm_project.settings
      DJANGO_DEBUG: "False"
      DJANGO_ENV: production
      DJANGO_SECRET_KEY: ci-secret-key-0123456789abcdefghijklmnopqrstuvwxyz-0123456789
      CONTACT_EMAIL: contact@example.com
      TURNSTILE_SITE_KEY: ci-site-key
      TURNSTILE_SECRET_KEY: ci-secret-key
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1,http://testserver
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cantateo_test
      REDIS_URL: redis://127.0.0.1:6379/0
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c requirements-lock.txt

      - name: Django checks
        run: python manage.py check --deploy

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: psalm_project.settings.ci
        run: pytest

      - name: Lint
        run: ruff check .

      - name: JavaScript syntax check
        run: npm run js:check

      - name: Dependency audit
        run: pip-audit -r requirements.txt

  browser-smoke:
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cantateo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cantateo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: psalm_project.settings
      DJANGO_DEBUG: "False"
      DJANGO_ENV: production
      DJANGO_SECRET_KEY: ci-secret-key-0123456789abcdefghijklmnopqrstuvwxyz-0123456789
      CONTACT_EMAIL: contact@example.com
      TURNSTILE_SITE_KEY: ci-site-key
      TURNSTILE_SECRET_KEY: ci-secret-key
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1,http://testserver
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cantateo_test
      REDIS_URL: redis://127.0.0.1:6379/0
      RUN_BROWSER_SMOKE: "1"
      DJANGO_ALLOW_ASYNC_UNSAFE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c requirements-lock.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run browser smoke
        env:
          DJANGO_SETTINGS_MODULE: psalm_project.settings.ci
        run: pytest psaumes/tests/test_browser_smoke.py -q --browser chromium
