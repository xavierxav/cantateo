[tool.ruff]
target-version = "py312"
extend-exclude = [
    "venv",
    "static/vendor",
    "staticfiles",
    "import_scripts",
    "psaumes/migrations",
]

[tool.ruff.lint]
# Keep CI focused on fatal correctness issues for now; style cleanup can be
# widened after the stabilization pass lands.
select = ["E9", "F63", "F7", "F82"]
